[package]
name = "openmind-runtime-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
openmind-db = { version = "1.0.5", path = "../db" }
openmind-network = { version = "1.0.5", path = "../network" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
flate2 = "1"
sha2 = "0.11.0"
tar = { version = "0.4", default-features = false }
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread", "time"] }
tracing.workspace = true
ureq = { version = "3.4.2", features = ["rustls"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
msi = "0.8"
cab = "0.6"
# zstd decoding (pure Rust) for conda-forge `.conda` packages: a zip holding `pkg-*.tar.zst`.
ruzstd = "0.8"

[dev-dependencies]
tempfile = "3.27.0"
