[package]
name = "openmind-runtime-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
openmind-db = { version = "0.1.0", path = "../db" }
openmind-network = { version = "0.1.0", path = "../network" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
flate2 = "1"
sha2 = "0.11.0"
tar = { version = "0.4", default-features = false }
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread"] }
tracing.workspace = true
ureq = { version = "3.4.2", features = ["rustls"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
