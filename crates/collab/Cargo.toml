[package]
name = "openmind-collab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "OpenMind Studio collaboration core: identities, Room Codes, roles and permissions, protocol frames, replay protection, the Owner's authority and audit chain. No networking, no database."

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
