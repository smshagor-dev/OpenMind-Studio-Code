openmind-fs = { path = "../fs" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.0"
subtle = "2.6"
thiserror.workspace = true
# Collaborative text (Milestone 24, phase 6): the Owner's canonical documents, wire-compatible with Yjs.
yrs = "0.28"

[dev-dependencies]
tempfile = "3.27.0"
