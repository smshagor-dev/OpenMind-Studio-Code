[package]
name = "openmind-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
openmind-network = { version = "1.0.5", path = "../network" }
openmind-runtime-manager = { version = "1.0.5", path = "../runtime-manager" }
getrandom = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
ureq = { version = "3.4.2", features = ["rustls"] }

[target."cfg(windows)".dependencies]
openmind-process = { version = "1.0.5", path = "../process" }
winapi = { version = "0.3", features = ["sysinfoapi", "fileapi", "winbase", "minwindef", "winerror", "dxgi", "winnt", "unknwnbase", "guiddef", "objbase"] }

[dev-dependencies]
sha2 = "0.11.0"
tempfile = "3.27.0"
