[package]
name = "openmind-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.22"
ureq = { version = "3.4.2", features = ["rustls"] }
openmind-ai = { version = "1.0.4", path = "../ai" }
openmind-network = { version = "1.0.4", path = "../network" }
openmind-fs = { version = "1.0.4", path = "../fs" }
openmind-search = { version = "1.0.4", path = "../search" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
trash = "5.2.9"
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
openmind-process = { version = "1.0.4", path = "../process" }

[dev-dependencies]
openmind-llm = { version = "1.0.4", path = "../llm" }
