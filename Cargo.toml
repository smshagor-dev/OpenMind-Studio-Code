[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "1.0.4"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["OpenMind Studio"]

[workspace.dependencies]
openmind-core = { path = "crates/core" }
openmind-db = { path = "crates/db" }
openmind-settings = { path = "crates/settings" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The MSI reader's decompressors (Tcl/Tk for Python, a Runtime Manager add-on) are far too slow unoptimized; debug
# builds and tests optimize just these two crates.
[profile.dev.package.lzxd]
opt-level = 3

[profile.dev.package.cab]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
