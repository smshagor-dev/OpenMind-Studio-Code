# Dedicated regression gates for manual and automatic local context allocation.
# Runs on every PR (no paths filter), main push and optional manual dispatch.
# These jobs do not download models and need no repository secrets.
name: Context Window Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-window-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.97.1"
  NODE_VERSION: "24.16.0"
  PNPM_VERSION: "11.10.0"
  CARGO_INCREMENTAL: "0"

jobs:
  model-contract:
    name: context / model contract
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal --component rustfmt
      - name: Validate Rust formatting
        run: cargo fmt --all -- --check
      - name: Validate llama-server context arguments and model limits
        run: cargo test --locked -p openmind-llm --lib
      - name: Validate session budgets, streaming and deferred completion
        run: cargo test --locked -p openmind-agent --lib
      - name: Validate HTTP cancellation on a stalled local stream
        run: cargo test --locked -p openmind-ai --lib transport::tests -- --nocapture
      - name: Validate request-level reasoning budget
        run: cargo test --locked -p openmind-agent --lib reasoning_budget

  desktop-context:
    name: context / desktop allocation
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Tauri build.rs requires generated, git-ignored legal bundle resources.
      - name: Prepare desktop legal resources
        shell: bash
        run: |
          cargo fetch --locked
          node scripts/third-party-licenses.mjs --check
          node scripts/legal-texts.mjs --check
      - name: Validate context allocation and observed GPU layer placement
        run: cargo test --locked -p openmind-studio --bin openmind-studio commands::agent::engine::tests -- --nocapture
      - name: Validate context lease exclusions
        run: cargo test --locked -p openmind-studio --bin openmind-studio commands::agent::engine::lease_tests -- --nocapture
      - name: Validate stream recovery and completion ordering
        run: |
          cargo test --locked -p openmind-studio --bin openmind-studio commands::agent::turn::cancellation_tests -- --nocapture
          cargo test --locked -p openmind-studio --bin openmind-studio commands::agent::completion_tests -- --nocapture

  frontend-context:
    name: context / settings and IPC
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate TypeScript and IPC signatures
        run: pnpm exec tsc --noEmit -p .
      - name: Lint context settings, panel and IPC
        run: pnpm exec eslint src/components/agent/AgentSettings.tsx src/components/agent/AgentSettings.test.tsx src/components/agent/AgentView.tsx src/services/agent/agentService.ts src/services/agent/agentService.test.ts src/services/agent/agentIpc.ts
      - name: Test context, GPU status, stream coalescing and history persistence
        run: pnpm exec vitest run src/components/agent/AgentSettings.test.tsx src/components/agent/AgentView.test.tsx src/services/agent/agentOptions.test.ts src/services/agent/agentService.test.ts src/services/agent/agentHistory.test.ts
      - name: Prepare frontend assets and build
        run: |
          node scripts/copy-monaco-workers.mjs
          node scripts/copy-pdf-assets.mjs
          pnpm exec vite build
