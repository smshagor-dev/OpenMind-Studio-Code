name: PascalABC.NET validation

on:
  workflow_dispatch:
  push:
    branches: [feature/pascalabc-runtime-integration]
    paths: [.github/workflows/pascalabc.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Inspect official console distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://pascalabc.net/downloads/PascalABCNET-Console-net10.zip' -OutFile console.zip
          Get-FileHash console.zip -Algorithm SHA256
          Expand-Archive console.zip compiler
          Get-ChildItem compiler
          Get-ChildItem compiler -Recurse -Filter '*runtimeconfig.json' | ForEach-Object { $_.FullName; Get-Content $_.FullName }
          Get-ChildItem compiler -Recurse -Filter pabcnetc.dll | ForEach-Object { [Diagnostics.FileVersionInfo]::GetVersionInfo($_.FullName) | Format-List FileVersion,ProductVersion }
          dotnet --list-runtimes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-console-research
          path: console.zip
          retention-days: 1
