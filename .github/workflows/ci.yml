# Quality gates for every push and pull request to main, and the first job of the release workflow (workflow_call).
# Read-only: no secret, no write permission, nothing published.
#
# Versions are pinned: actions by commit (the tag in the comment), Node/pnpm/Rust to what the release was built with.
# RUSTUP_TOOLCHAIN overrides rust-toolchain.toml's `stable` here only, so CI doesn't change with every Rust release.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.97.1"
  NODE_VERSION: "24.16.0"
  PNPM_VERSION: "11.10.0"
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: checks (windows)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Rust ${{ env.RUSTUP_TOOLCHAIN }}
        run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal --component clippy,rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: eslint
        run: pnpm lint

      - name: TypeScript
        run: pnpm exec tsc --noEmit -p .

      - name: Frontend tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

  linux:
    name: checks (linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev

      - name: Rust ${{ env.RUSTUP_TOOLCHAIN }}
        run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal

      # Every crate and test must compile for Linux. Not yet `-D warnings`: the Linux build has 37 dead-code/unused
      # warnings (Windows-only code behind cfg; 32 in openmind-studio, 3 in collab-net, 2 in git) to clean up first.
      - name: cargo check (Linux build of every crate and test)
        run: cargo check --workspace --all-targets
