[package]
name = "openmind-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "openmind-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openmind-core = { version = "0.1.0", path = "../crates/core" }
openmind-db = { version = "0.1.0", path = "../crates/db" }
openmind-settings = { version = "0.1.0", path = "../crates/settings" }
tauri = { version = "2.11.6", features = [] }
tracing.workspace = true
