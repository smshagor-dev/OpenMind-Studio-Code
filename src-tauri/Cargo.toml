[package]
name = "openmind-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "openmind-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
openmind-core = { version = "0.1.0", path = "../crates/core" }
openmind-db = { version = "0.1.0", path = "../crates/db" }
openmind-file-watch = { version = "0.1.0", path = "../crates/file-watch" }
openmind-dap = { version = "0.1.0", path = "../crates/dap" }
openmind-lsp = { version = "0.1.0", path = "../crates/lsp" }
openmind-extensions = { version = "0.1.0", path = "../crates/extensions" }
openmind-git = { version = "0.1.0", path = "../crates/git" }
openmind-fs = { version = "0.1.0", path = "../crates/fs" }
openmind-search = { version = "0.1.0", path = "../crates/search" }
openmind-runner = { version = "0.1.0", path = "../crates/runner" }
openmind-runtime-manager = { version = "0.1.0", path = "../crates/runtime-manager" }
openmind-settings = { version = "0.1.0", path = "../crates/settings" }
openmind-terminal = { version = "0.1.0", path = "../crates/terminal" }
openmind-workspace = { version = "0.1.0", path = "../crates/workspace" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tauri = { version = "2.11.6", features = ["tray-icon"] }
getrandom = "0.3"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2.7.3"
tokio = { version = "1.53.1", features = ["time", "rt"] }
tracing.workspace = true
thiserror.workspace = true

[target."cfg(windows)".dependencies]
winapi = { version = "0.3", features = ["dpapi", "wincrypt", "winbase", "errhandlingapi", "minwindef"] }
