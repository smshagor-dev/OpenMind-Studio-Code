[package]
name = "codeforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "codeforge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
codeforge-core = { version = "0.1.0", path = "../crates/core" }
codeforge-db = { version = "0.1.0", path = "../crates/db" }
codeforge-settings = { version = "0.1.0", path = "../crates/settings" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tauri = { version = "2.11.6", features = [] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
